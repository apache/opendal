name: read_only
description: 'Behavior test for gist service in read-only mode'

runs:
  using: "composite"
  steps:
    # The Actions GITHUB_TOKEN cannot read gists at all (403 "Resource not
    # accessible by integration"), so these tests need a stored personal
    # token with gist access to keep the API rate limit far from the
    # unauthenticated 60 requests per hour.
    - name: Setup secret
      uses: 1Password/load-secrets-action@70062d7a876d3eb6334754fa26efd2fbd90c32f2 # v5.0.1
      with:
        export-env: true
      env:
        OPENDAL_GIST_TOKEN: op://services/gist/token
    - name: Setup env
      shell: bash
      run: |
        # Run the read-only behavior tests against the public fixture gist
        # 8c08bb21c11fff59ef16c9f4785abced. Every file is small enough to be
        # served from the inline gist content, and binary_file.png exercises
        # the base64 decoding path.
        cat << EOF >> $GITHUB_ENV
        OPENDAL_GIST_GIST_ID=8c08bb21c11fff59ef16c9f4785abced
        OPENDAL_DISABLE_RANDOM_ROOT=true
        OPENDAL_TEST_CAPABILITY_OVERRIDES=write=false,delete=false,create_dir=false
        EOF
