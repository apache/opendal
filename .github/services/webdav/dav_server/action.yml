name: dav-server
description: "Behavior test for WebDAV on dav-server"

runs:
  using: composite
  steps:
    - name: Start dav-server
      shell: bash
      working-directory: fixtures/webdav/dav-server
      run: |
        set -euo pipefail
        server=$(cargo build --locked --message-format=json-render-diagnostics |
          jq -er 'select(.reason == "compiler-artifact" and .executable != null) | .executable')
        fixture_dir=$(mktemp -d "$RUNNER_TEMP/opendal-dav-server.XXXXXX")
        mkdir "$fixture_dir/data"
        "$server" "$fixture_dir/data" >"$fixture_dir/endpoint" 2>"$fixture_dir/server.log" &
        server_pid=$!

        for attempt in {1..30}; do
          if ! kill -0 "$server_pid" 2>/dev/null; then
            break
          fi
          if read -r endpoint <"$fixture_dir/endpoint" &&
            curl --silent --fail --max-time 1 --request PROPFIND --header "Depth: 0" "$endpoint/" >/dev/null; then
            # With a failed precondition, dav-server 0.12.0 sends 412 and Connection: close
            # before reading the HTTP/1 request body, which can cause EPIPE on multi-MiB PUTs.
            cat <<EOF >>"$GITHUB_ENV"
        OPENDAL_WEBDAV_ENDPOINT=$endpoint
        OPENDAL_TEST_CAPABILITY_OVERRIDES=write_total_max_size=4096,write_with_user_metadata=false,read_with_if_none_match=false,read_with_if_modified_since=false,rename_with_if_not_exists=false
        EOF
            exit 0
          fi
          sleep 1
        done

        echo "dav-server failed its readiness check" >&2
        cat "$fixture_dir/server.log" >&2
        kill "$server_pid" 2>/dev/null || true
        wait "$server_pid" 2>/dev/null || true
        rm -rf "$fixture_dir"
        exit 1
