name: Bindings Cpp CI

on:
  push:
    tags:
      - '*'
  pull_request:
    branches:
      - main
    paths:
      - "bindings/cpp/**"
      - "examples/cpp/**"
      - ".github/actions/setup/**"
      - ".github/workflows/ci_bindings_cpp.yml"
  workflow_call:
  workflow_dispatch:

concurrency:
  group: ci-bindings-cpp-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build valgrind doxygen

      - name: Setup Rust toolchain
        uses: ./.github/actions/setup

      # Useful for debugging
      - name: Print Clippy version
        working-directory: "bindings/cpp"
        run: cargo clippy --version

      - name: Clippy Check
        working-directory: "bindings/cpp"
        run: cargo clippy -- -D warnings

      - name: Build Cpp binding && Run tests
        working-directory: "bindings/cpp"
        run: |
          mkdir build
          cd build
          cmake -GNinja -DOPENDAL_DEV=ON -DFEATURES=opendal/services-memory ..
          ninja
          ./opendal_cpp_test

      - name: Run tests with valgrind
        working-directory: "bindings/cpp"
        run: |
          mkdir build-valgrind
          cd build-valgrind
          cmake -GNinja -DOPENDAL_ENABLE_TESTING=ON -DFEATURES=opendal/services-memory ..
          ninja
          valgrind --leak-check=full --show-leak-kinds=all --track-origins=yes --verbose ./opendal_cpp_test

      - name: Build Cpp binding with async && Run tests
        working-directory: "bindings/cpp"
        run: |
          mkdir build-async
          cd build-async
          cmake -GNinja -DOPENDAL_DEV=ON -DOPENDAL_ENABLE_ASYNC=ON -DFEATURES=opendal/services-memory -DCMAKE_CXX_COMPILER=clang++-18 ..
          ninja
          ./opendal_cpp_test

      - name: test async with valgrind
        working-directory: "bindings/cpp"
        run: |
          mkdir build-valgrind-async
          cd build-valgrind-async
          cmake -GNinja -DOPENDAL_ENABLE_ASYNC=ON -DFEATURES=opendal/services-memory -DOPENDAL_ENABLE_TESTING=ON -DCMAKE_CXX_COMPILER=clang++-18 ..
          ninja
          valgrind --leak-check=full --show-leak-kinds=all --track-origins=yes --verbose ./opendal_cpp_test

      - name: Build Cpp examples
        working-directory: "examples/cpp"
        run: |
          mkdir build
          cd build
          cmake -GNinja ..
          ninja

      - name: Run getting-started example
        working-directory: "examples/cpp/build"
        run: ./getting-started

  test-windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        build-type: [Debug, Release]
    defaults:
      run:
        # Git Bash puts its own link.exe ahead of the MSVC linker.
        shell: pwsh

    steps:
      - uses: actions/checkout@v7
      - uses: ilammy/msvc-dev-cmd@v1
      - uses: ./.github/actions/setup

      - name: Build Cpp binding and run tests
        working-directory: "bindings/cpp"
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          cmake -S . -B build -GNinja -DCMAKE_CXX_COMPILER=cl "-DCMAKE_BUILD_TYPE=${{ matrix.build-type }}" -DOPENDAL_ENABLE_TESTING=ON
          cmake --build build
          .\build\opendal_cpp_test.exe

      - name: Build and run Cpp examples
        working-directory: "examples/cpp"
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          cmake -S . -B build -GNinja -DCMAKE_CXX_COMPILER=cl "-DCMAKE_BUILD_TYPE=${{ matrix.build-type }}"
          cmake --build build
          .\build\basic-example.exe
          .\build\getting-started.exe
