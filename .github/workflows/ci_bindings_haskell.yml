name: Bindings Haskell CI

on:
  push:
    tags:
      - "*"
  pull_request:
    branches:
      - main
    paths:
      - "bindings/haskell/**"
      - ".github/actions/setup/**"
      - ".github/workflows/ci_bindings_haskell.yml"
  workflow_call:
  workflow_dispatch:

concurrency:
  group: ci-bindings-haskell-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    # GHC's hsc2hs links with -fuse-ld=gold, which Ubuntu 26.04's
    # binutils no longer ships.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install Haskell build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y alex happy
      - name: Setup Haskell toolchain (ghc-9.4.8)
        env:
          GHCUP_INSTALL_BASE_PREFIX: ${{ runner.temp }}
        run: |
          export PATH="${GHCUP_INSTALL_BASE_PREFIX}/.ghcup/bin:${PATH}"
          echo "${GHCUP_INSTALL_BASE_PREFIX}/.ghcup/bin" >> "${GITHUB_PATH}"
          mkdir -p "${HOME}/.cabal"
          cat > "${HOME}/.cabal/config" <<'EOF'
          repository hackage-direct
            url: https://hackage.haskell.org/
            secure: False
          active-repositories: hackage-direct
          EOF
          curl --proto '=https' --tlsv1.2 -sSf https://get-ghcup.haskell.org | BOOTSTRAP_HASKELL_NONINTERACTIVE=1 BOOTSTRAP_HASKELL_MINIMAL=1 sh
          ghcup install ghc 9.4.8 --set
          ghcup install cabal --set
          cabal update --ignore-project
      - name: Setup Rust toolchain
        uses: ./.github/actions/setup
      # Useful for debugging
      - name: Print Clippy version
        working-directory: "bindings/haskell"
        run: cargo clippy --version

      - name: Clippy Check
        working-directory: "bindings/haskell"
        run: cargo clippy -- -D warnings
      - name: Restore haskell cache
        uses: actions/cache/restore@v6
        with:
          key: ${{ runner.os }}-haskell-${{ hashFiles('**/*.cabal', '**/Setup.hs') }}
          path: |
            ~/.cabal/store
            bindings/haskell/dist-newstyle
          restore-keys: ${{ runner.os }}-haskell-
      - name: Build & Test
        working-directory: "bindings/haskell"
        run: |
          cabal test
      - name: Run getting-started example
        working-directory: "bindings/haskell"
        # The example compiles and links, but cabal's post-link install step
        # cannot register the libopendal_hs foreign library (a Custom-Setup
        # quirk). Tolerate that step, then run the linked binary directly; a real
        # compile error leaves no binary (exit 1) and a runtime error fails here.
        run: |
          cabal build exe:getting-started || true
          bin=$(find dist-newstyle -type f -name getting-started -path '*/build/getting-started/*' | head -1)
          if [ -z "$bin" ]; then echo "getting-started failed to build"; exit 1; fi
          echo "running $bin"
          "$bin"
      - name: Save haskell cache
        uses: actions/cache/save@v6
        with:
          key: ${{ runner.os }}-haskell-${{ hashFiles('**/*.cabal', '**/Setup.hs') }}
          path: |
            ~/.cabal/store
            bindings/haskell/dist-newstyle
      - name: Build docs
        working-directory: "bindings/haskell"
        run: cabal haddock --haddock-html --haddock-quickjump --haddock-hyperlink-source -j

  test-windows-metadata:
    runs-on: windows-2025
    timeout-minutes: 45
    defaults:
      run:
        working-directory: bindings/haskell
    steps:
      - uses: actions/checkout@v7
      - name: Install native x64 GHC and Cabal
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $toolchain = "$env:RUNNER_TEMP/haskell"
          New-Item -ItemType Directory -Path $toolchain | Out-Null
          $ghc = 'ghc-9.4.8-x86_64-unknown-mingw32'
          $cabal = 'cabal-install-3.16.1.0'
          curl.exe -fsSL --retry 3 "https://downloads.haskell.org/ghc/9.4.8/$ghc.tar.xz" -o "$toolchain/ghc.tar.xz"
          tar.exe -xf "$toolchain/ghc.tar.xz" -C "$toolchain"
          curl.exe -fsSL --retry 3 "https://downloads.haskell.org/cabal/$cabal/$cabal-x86_64-windows.zip" -o "$toolchain/cabal.zip"
          Expand-Archive "$toolchain/cabal.zip" "$toolchain/cabal"
          "$toolchain/$ghc/bin" >> $env:GITHUB_PATH
          "$toolchain/cabal" >> $env:GITHUB_PATH
      - name: Build Rust DLL
        run: cargo build --target x86_64-pc-windows-msvc
      - name: Run metadata test against the DLL
        shell: bash
        # Link the focused test directly to the Rust DLL. Setup.hs configures
        # Unix rpath for Cabal's library build. Keep the dependencies and GHC
        # extensions in sync with opendal.cabal.
        run: |
          ghc --info
          mkdir -p dist-newstyle
          cabal_config=dist-newstyle/metadata-cabal.config
          cat > "$cabal_config" <<'EOF'
          repository hackage-direct
            url: https://hackage.haskell.org/
            secure: False
          active-repositories: hackage-direct
          EOF
          cabal --config-file="$cabal_config" update --ignore-project
          # Make GHC's bundled cc available to dependency configure scripts.
          mingw_bin="$(cygpath -u "$RUNNER_TEMP")/haskell/ghc-9.4.8-x86_64-unknown-mingw32/mingw/bin"
          PATH="$PATH:$mingw_bin" \
          cabal --config-file="$cabal_config" install --ignore-project --lib --package-env=./metadata-test.env \
            bytestring mtl text time unordered-containers co-log network tasty tasty-hunit \
            --constraint='bytestring >= 0.11.4 && < 0.12' --constraint='mtl >= 2.2.2 && < 2.3' \
            --constraint='text >= 2.0.2 && < 2.1' --constraint='time >= 1.11.1 && < 1.12' \
            --constraint='unordered-containers >= 0.2.19 && < 0.3' --constraint='co-log >= 0.5 && < 0.7' \
            --constraint='network >= 3.2 && < 3.3' --constraint='tasty >= 1.5 && < 1.6' \
            --constraint='tasty-hunit >= 0.10.1 && < 0.11'
          rust_dir=target/x86_64-pc-windows-msvc/debug
          ghc --make -threaded -ihaskell-src -outputdir dist-newstyle/metadata-test \
            -package-env metadata-test.env -XOverloadedStrings -XForeignFunctionInterface \
            -XDerivingStrategies -XGeneralizedNewtypeDeriving -XLambdaCase \
            -L"$rust_dir" -l:opendal_hs.dll.lib -o "$rust_dir/metadata-test.exe" test/MetadataTest.hs
          "$rust_dir/metadata-test.exe"

  package:
    # GHC's hsc2hs links with -fuse-ld=gold, which Ubuntu 26.04's
    # binutils no longer ships.
    runs-on: ubuntu-24.04
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    steps:
      - uses: actions/checkout@v7
      - name: Install Haskell build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y alex happy
      - name: Setup Haskell toolchain (ghc-9.2.8)
        env:
          GHCUP_INSTALL_BASE_PREFIX: ${{ runner.temp }}
        run: |
          export PATH="${GHCUP_INSTALL_BASE_PREFIX}/.ghcup/bin:${PATH}"
          echo "${GHCUP_INSTALL_BASE_PREFIX}/.ghcup/bin" >> "${GITHUB_PATH}"
          mkdir -p "${HOME}/.cabal"
          cat > "${HOME}/.cabal/config" <<'EOF'
          repository hackage-direct
            url: https://hackage.haskell.org/
            secure: False
          active-repositories: hackage-direct
          EOF
          curl --proto '=https' --tlsv1.2 -sSf https://get-ghcup.haskell.org | BOOTSTRAP_HASKELL_NONINTERACTIVE=1 BOOTSTRAP_HASKELL_MINIMAL=1 sh
          ghcup install ghc 9.2.8 --set
          ghcup install cabal --set
          cabal update --ignore-project
      - name: Setup Rust toolchain
        uses: ./.github/actions/setup
      - name: Restore haskell cache
        uses: actions/cache/restore@v6
        with:
          key: ${{ runner.os }}-haskell-${{ hashFiles('**/*.cabal', '**/Setup.hs') }}
          path: |
            ~/.cabal/store
            bindings/haskell/dist-newstyle
          restore-keys: ${{ runner.os }}-haskell-
      - name: Package
        working-directory: "bindings/haskell"
        run: |
          cargo package --no-verify --target-dir target
          cd target/package
          tar xf opendal-*.crate --strip-components=1
          cabal sdist
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: bindings-haskell-sdist
          path: bindings/haskell/target/package/dist-newstyle/sdist/*.tar.gz
