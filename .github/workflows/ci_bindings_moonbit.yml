name: Bindings MoonBit CI

on:
  push:
    branches:
      - main
    tags:
      - "*"
    paths: &paths
      - "core/**"
      - "bindings/c/**"
      - "bindings/moonbit/**"
      - ".github/actions/setup/**"
      - ".github/workflows/ci_bindings_moonbit.yml"
  pull_request:
    branches:
      - main
    paths: *paths
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  MOONBIT_VERSION: 0.10.6+80dc50f24

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust toolchain
        uses: ./.github/actions/setup

      - name: Install native build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config uuid-dev

      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s "$MOONBIT_VERSION"
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Print tool versions
        run: |
          rustc --version
          cargo --version
          moon version --all

      - name: Check binding
        working-directory: bindings/moonbit
        run: make check

      - name: Run tests
        working-directory: bindings/moonbit
        run: make test

      - name: Check generated files
        run: git diff --exit-code
