name: Bindings OCaml CI

on:
  push:
    tags:
      - "*"
  pull_request:
    branches:
      - main
    paths:
      - "core/core/src/types/capability.rs"
      - "dev/src/generate/**"
      - "bindings/ocaml/**"
      - ".github/actions/setup-ocaml/**"
      - ".github/workflows/ci_bindings_ocaml.yml"
  workflow_call:
  workflow_dispatch:

concurrency:
  group: ci-bindings-ocaml-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout PR
        uses: actions/checkout@v7

      - name: Setup OCaml toolchain
        uses: ./.github/actions/setup-ocaml
        with:
          need-depext: true
          need-pin: true

      # Useful for debugging
      - name: Print Clippy version
        working-directory: "bindings/ocaml"
        run: cargo clippy --version

      - name: Clippy Check
        working-directory: "bindings/ocaml"
        run: cargo clippy -- -D warnings

  test:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout PR
        uses: actions/checkout@v7

      - name: Setup OCaml toolchain
        uses: ./.github/actions/setup-ocaml
        with:
          need-depext: true
          need-pin: true

      - name: Checks
        run: |
          # make sure tests pass
          opam install -y dune ounit2 ocamlformat odoc
          eval $(opam env)
          cd bindings/ocaml
          dune build @fmt
          dune runtest
          dune build @doc

      - name: Check generated code is up to date
        run: |
          cargo run --manifest-path=dev/Cargo.toml -- generate -l ocaml
          cargo fmt --manifest-path bindings/ocaml/Cargo.toml --all
          # `dune build` above also regenerates src/operator.ml{,i} via ocaml-build.
          git diff --exit-code

      - name: Run getting-started example
        run: |
          eval $(opam env)
          cd bindings/ocaml
          dune build examples/getting_started.exe
          dune build @run_examples
