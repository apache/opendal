name: Bindings Python CI

on:
  pull_request:
    branches:
      - main
    paths:
      - "core/Cargo.toml"
      - "core/Cargo.lock"
      - "core/src/**"
      - "core/core/Cargo.toml"
      - "core/core/src/**"
      - "!core/core/src/docs/**"
      - "core/http-transports/**"
      - "core/layers/mime-guess/**"
      - "dev/src/generate/**"
      - "bindings/python/**"
      - ".github/actions/setup/**"
      - ".github/workflows/ci_bindings_python.yml"
  workflow_call:
  workflow_dispatch:

concurrency:
  group: ci-bindings-python-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust toolchain
        uses: ./.github/actions/setup

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          working-directory: "bindings/python"

      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: just

      # Useful for debugging
      - name: Print Clippy version
        working-directory: "bindings/python"
        run: cargo clippy --version

      - name: Run Lints
        working-directory: "bindings/python"
        run: just lint

      - name: Check Python stable ABI
        working-directory: "bindings/python"
        run: cargo check --features abi3

  stubs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust toolchain
        uses: ./.github/actions/setup

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          working-directory: "bindings/python"

      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: just

      - name: Setup taplo
        uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: taplo-cli

      - name: Install Hawkeye
        uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: hawkeye@7.2.0

      - name: Regenerate stubs
        working-directory: "bindings/python"
        run: just stub-gen

      - name: Check diff
        run: git diff --exit-code

      - name: Check typed operator configuration
        working-directory: "bindings/python"
        run: just test-typing

  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust toolchain
        uses: ./.github/actions/setup
        with:
          need-protoc: true
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          working-directory: bindings/python

      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: just

      - name: Build with maturin
        shell: bash
        working-directory: "bindings/python"
        run: |
          uv venv --python=python3.11
          uv sync --locked --all-extras --group cookbook
          uv run -- maturin develop

      # Examples back the snippets shown in the website guide. Running them keeps
      # the docs honest: a broken example fails CI instead of shipping bad docs.
      - name: Run guide examples
        shell: bash
        working-directory: "bindings/python"
        run: uv run -- python examples/getting_started.py

      - name: Run cookbook notebooks
        working-directory: bindings/python
        run: just test-notebooks
