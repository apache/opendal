name: Docs.rs CI

on:
  pull_request:
    branches:
      - main
    paths:
      - "core/**/Cargo.toml"
      - "core/Cargo.toml"
      - "core/Cargo.lock"
      - ".github/scripts/check_docsrs.py"
      - ".github/scripts/test_check_docsrs.py"
      - ".github/workflows/ci_docsrs.yml"
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-docsrs-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check_docsrs:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Test docs.rs checker
        run: python3 -m unittest discover -s .github/scripts -p "test_check_docsrs.py"

      - name: Setup Rust Nightly
        run: |
          rustup toolchain install nightly --profile minimal --target x86_64-unknown-linux-gnu
          rustc +nightly --version
          rustdoc +nightly --version

      - name: Verify opendal-core package tarball
        working-directory: core
        run: cargo +nightly package --locked -p opendal-core

      - name: Build docs in docs.rs sandbox
        run: |
          python3 .github/scripts/check_docsrs.py \
            --toolchain nightly \
            --manifest-path core/Cargo.toml \
            --manifest-path core/services/rocksdb/Cargo.toml
