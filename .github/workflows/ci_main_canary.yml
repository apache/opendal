name: Main Canary

on:
  push:
    branches:
      - main
    paths:
      - "core/**"
      - "!core/**/*.md"
      - "!core/core/src/docs/**"
      - "rust-toolchain.toml"
      - ".config/nextest.toml"
      - ".github/actions/setup/**"
      - ".github/workflows/ci_main_canary.yml"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/ci_main_canary.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-main-canary-${{ github.ref }}
  cancel-in-progress: true

jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust toolchain
        uses: ./.github/actions/setup
        with:
          need-rocksdb: true
          need-protoc: true
          need-nextest: true
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup java env
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 25

      - name: Check workspace libraries with all features
        working-directory: core
        run: cargo check --workspace --lib --all-features --locked

      - name: Run core and facade unit tests
        working-directory: core
        run: cargo nextest run -p opendal-core -p opendal --locked
