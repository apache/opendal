name: Weekly release tooling CI
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - '.github/scripts/weekly_release/**'
      - '.github/workflows/weekly_release.yml'
      - '.github/workflows/release-compose.yml'
      - '.github/workflows/ci_weekly_release.yml'
      - '.release/**'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s .github/scripts/weekly_release -p 'test_*.py'
