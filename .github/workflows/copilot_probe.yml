name: Copilot CLI availability probe

on:
  push:
    branches: [xuanwo/copilot-actions-probe]
    paths: [.github/workflows/copilot_probe.yml]

permissions:
  contents: read
  copilot-requests: write

jobs:
  probe:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Install Copilot CLI
        run: npm install --global @github/copilot@1.0.83
      - name: Verify Actions token inference
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          copilot --version
          copilot -p 'Reply with exactly COPILOT_ACTIONS_OK. Do not use any tools.' \
            --silent --disable-builtin-mcps --allow-all-tools --available-tools= \
            --max-ai-credits 30 > "$RUNNER_TEMP/copilot-response.txt"
          cat "$RUNNER_TEMP/copilot-response.txt"
          python3 - <<'PYTHON'
          import os
          from pathlib import Path

          response = Path(os.environ['RUNNER_TEMP'], 'copilot-response.txt').read_text().strip()
          if response != 'COPILOT_ACTIONS_OK':
              raise SystemExit('Copilot did not return the expected response')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('Copilot CLI inference succeeded with the built-in GITHUB_TOKEN.\n')
          PYTHON
