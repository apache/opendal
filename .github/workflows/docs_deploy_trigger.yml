name: Docs Deploy Trigger

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  dispatch:
    if: github.repository == 'apache/opendal'
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
      pull-requests: read
    steps:
      - name: Dispatch Docs deploy for labeled PR merge
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          shas=$(jq -r '[.commits[]?.id] | if length > 0 then .[] else env.SHA end' "${GITHUB_EVENT_PATH}")
          for sha in ${shas}; do
            matched=$(gh api "repos/${REPOSITORY}/commits/${sha}/pulls" \
              --jq '[.[] | select(.merged_at != null and ([.labels[].name] | index("ci/deploy-docs") != null))] | length')
            echo "Commit ${sha}: matched merged PRs with ci/deploy-docs: ${matched}"
            if [ "${matched}" -gt 0 ]; then
              gh workflow run docs.yml \
                --repo "${REPOSITORY}" \
                --ref main \
                -f deploy-gh-pages=true \
                -f deploy-nightlies=false
              echo "Dispatched docs.yml for ${sha} (head ${SHA})."
              exit 0
            fi
          done
          echo "No merged PR in this push carries ci/deploy-docs."
