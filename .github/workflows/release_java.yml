name: Release Java Binding

on:
  push:
    tags:
      # Staging JARs on Apache Nexus repository for RCs. Read more on
      # https://opendal.apache.org/community/committers/release/#release-maven-artifacts
      - "v[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/release_java.yml"
      - "scripts/merge_local_staging.py"
      - "bindings/java/pom.xml"
      - "bindings/java/src/assembly/**"
      - "bindings/java/src/main/java/org/apache/opendal/Environment.java"
      - "bindings/java/src/main/java/org/apache/opendal/NativeLibrary.java"
      - "bindings/java/src/main/resources/META-INF/**"
      - "bindings/java/tools/all_natives.py"
      - "bindings/java/tools/build.py"
  workflow_dispatch:

env:
  CARGO_BUILD_ENABLE_ZIGBUILD: "true"

jobs:
  stage-snapshot:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            classifier: linux-x86_64
          - os: ubuntu-latest
            classifier: linux-x86_64-musl
          - os: ubuntu-24.04-arm
            classifier: linux-aarch_64
          - os: ubuntu-24.04-arm
            classifier: linux-aarch_64-musl
          - os: windows-latest
            classifier: windows-x86_64
          - os: macos-latest
            classifier: osx-x86_64
          - os: macos-latest
            classifier: osx-aarch_64
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 8
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: "8"
          cache: "maven"
          server-id: apache.releases.https
          server-username: MAVEN_USERNAME
          server-password: MAVEN_CENTRAL_TOKEN
          gpg-private-key: ${{ github.event_name != 'pull_request' && secrets.GPG_SECRET_KEY || '' }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Setup Rust toolchain
        uses: ./.github/actions/setup
        with:
          need-protoc: true
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup linux for zigbuild
        if: ${{ contains(matrix.os, 'ubuntu') }}
        run: pip install cargo-zigbuild

      - name: Build linux musl JNI library in Alpine
        if: ${{ contains(matrix.os, 'ubuntu') && contains(matrix.classifier, 'musl') }}
        shell: bash
        run: |
          set -euo pipefail
          HOST_UID="$(id -u)"
          HOST_GID="$(id -g)"
          PLATFORM="linux/amd64"
          if [[ "${{ matrix.classifier }}" == *"aarch_64"* ]]; then
            PLATFORM="linux/arm64"
          fi

          docker run --rm \
            --platform "$PLATFORM" \
            -e HOST_UID="$HOST_UID" \
            -e HOST_GID="$HOST_GID" \
            -v "$GITHUB_WORKSPACE":/work \
            -w /work/bindings/java \
            rust:1.91-alpine3.20 \
            sh -lc '
              set -eu
              apk add --no-cache python3 build-base cmake pkgconfig git protobuf sqlite-dev zlib-dev
              export PATH=/usr/local/cargo/bin:$PATH

              python3 tools/build.py \
                --classifier "${{ matrix.classifier }}" \
                --profile release \
                --enable-zigbuild false

              chown -R "$HOST_UID:$HOST_GID" /work/bindings/java/target
            '

      - name: Local staging
        working-directory: bindings/java
        shell: bash
        run: |
          EXTRA_MVN_ARGS=""
          if [[ "${{ matrix.classifier }}" == *"musl" ]]; then
            EXTRA_MVN_ARGS="-Dexec.skip=true"
          fi

          MVN_GOALS="verify"
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            EXTRA_MVN_ARGS="$EXTRA_MVN_ARGS -Dgpg.skip=true"
          else
            MVN_GOALS="$MVN_GOALS org.sonatype.plugins:nexus-staging-maven-plugin:deploy"
            EXTRA_MVN_ARGS="$EXTRA_MVN_ARGS \
              -DaltStagingDirectory=local-staging \
              -DskipRemoteStaging=true \
              -DserverId=apache.releases.https \
              -DnexusUrl=https://repository.apache.org"
          fi

          ./mvnw -Papache-release $MVN_GOALS \
            -DskipTests=true \
            -Djni.classifier=${{ matrix.classifier }} \
            -Dcargo-build.profile=release \
            -Dcargo-build.enableZigbuild=${{ env.CARGO_BUILD_ENABLE_ZIGBUILD }} \
            $EXTRA_MVN_ARGS
        env:
          MAVEN_USERNAME: ${{ github.event_name != 'pull_request' && secrets.NEXUS_STAGE_DEPLOYER_USER || '' }}
          MAVEN_CENTRAL_TOKEN: ${{ github.event_name != 'pull_request' && secrets.NEXUS_STAGE_DEPLOYER_PW || '' }}
          MAVEN_GPG_PASSPHRASE: ""
      - name: Smoke linux musl JNI library in Alpine
        if: ${{ contains(matrix.os, 'ubuntu') && contains(matrix.classifier, 'musl') }}
        shell: bash
        run: |
          set -euo pipefail
          PLATFORM="linux/amd64"
          if [[ "${{ matrix.classifier }}" == *"aarch_64"* ]]; then
            PLATFORM="linux/arm64"
          fi

          docker run --rm \
            --platform "$PLATFORM" \
            -v "$GITHUB_WORKSPACE":/work \
            -w /work/bindings/java \
            alpine:3.20 \
            sh -lc '
              set -eu
              apk add --no-cache openjdk17-jdk libgcc
              BASE_JAR="$(find target -maxdepth 1 -name "opendal-*.jar" ! -name "*-linux-*.jar" ! -name "*-sources.jar" ! -name "*-javadoc.jar" | head -n 1)"
              NATIVE_JAR="$(find target -maxdepth 1 -name "opendal-*-${{ matrix.classifier }}.jar" | head -n 1)"
              test -n "$BASE_JAR"
              test -n "$NATIVE_JAR"

              {
                echo "import org.apache.opendal.NativeLibrary;"
                echo "public class OpenDALSmoke {"
                echo "    public static void main(String[] args) {"
                echo "        NativeLibrary.loadLibrary();"
                echo "    }"
                echo "}"
              } > /tmp/OpenDALSmoke.java

              java -cp "$BASE_JAR:$NATIVE_JAR" /tmp/OpenDALSmoke.java
            '
      - name: Upload platform JAR
        uses: actions/upload-artifact@v7
        with:
          name: java-native-${{ matrix.classifier }}
          path: bindings/java/target/opendal-*-${{ matrix.classifier }}.jar
          if-no-files-found: error
          compression-level: 0
      - name: Upload local staging directory
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.classifier }}-local-staging
          path: bindings/java/local-staging
          if-no-files-found: error
          include-hidden-files: true

  assemble-all-natives:
    runs-on: ubuntu-latest
    needs: [stage-snapshot]
    defaults:
      run:
        working-directory: bindings/java
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 8
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: "8"
          cache: "maven"
          server-id: apache.releases.https
          server-username: MAVEN_USERNAME
          server-password: MAVEN_CENTRAL_TOKEN
          gpg-private-key: ${{ github.event_name != 'pull_request' && secrets.GPG_SECRET_KEY || '' }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Download platform JARs
        uses: actions/download-artifact@v8
        with:
          pattern: java-native-*
          merge-multiple: true
          path: bindings/java/target/platform-jars
      - name: Assemble all-natives JAR
        shell: bash
        run: |
          mvn_args=(-Pall-natives -Dall.natives.dir=target/platform-jars -DskipTests=true)
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            ./mvnw -B -ntp "${mvn_args[@]}" package
          else
            ./mvnw -B -ntp "${mvn_args[@]}" -Papache-release verify \
              org.sonatype.plugins:nexus-staging-maven-plugin:deploy \
              -DaltStagingDirectory=local-staging \
              -DskipRemoteStaging=true \
              -DserverId=apache.releases.https \
              -DnexusUrl=https://repository.apache.org
          fi
        env:
          MAVEN_USERNAME: ${{ github.event_name != 'pull_request' && secrets.NEXUS_STAGE_DEPLOYER_USER || '' }}
          MAVEN_CENTRAL_TOKEN: ${{ github.event_name != 'pull_request' && secrets.NEXUS_STAGE_DEPLOYER_PW || '' }}
          MAVEN_GPG_PASSPHRASE: ""
      - name: Verify all-natives JAR
        timeout-minutes: 2
        shell: bash
        run: |
          shopt -s nullglob
          all_jars=(target/opendal-*-all.jar)
          test "${#all_jars[@]}" -eq 1
          all_jar="${all_jars[0]}"
          python3 tools/all_natives.py verify target/platform-jars "${all_jar%-all.jar}.jar" "$all_jar"

          smoke_dir="$(mktemp -d)"
          mkdir "$smoke_dir/empty"
          cat > "$smoke_dir/OpenDALSmoke.java" <<'JAVA'
          import java.nio.charset.StandardCharsets;
          import java.util.Arrays;
          import java.util.Collections;
          import org.apache.opendal.NativeLibrary;
          import org.apache.opendal.Operator;

          public class OpenDALSmoke {
              public static void main(String[] args) {
                  try {
                      NativeLibrary.loadLibrary();
                      byte[] content = "OpenDAL".getBytes(StandardCharsets.UTF_8);
                      try (Operator op = Operator.of("memory", Collections.emptyMap())) {
                          op.write("smoke", content);
                          if (!Arrays.equals(content, op.read("smoke"))) {
                              throw new AssertionError("Memory service returned unexpected data");
                          }
                      }
                  } catch (Throwable error) {
                      error.printStackTrace();
                      System.exit(1);
                  }
                  // JNI worker threads can keep a standalone JVM alive after main returns.
                  System.exit(0);
              }
          }
          JAVA
          javac -cp "$all_jar" -d "$smoke_dir" "$smoke_dir/OpenDALSmoke.java"
          java -Djava.library.path="$smoke_dir/empty" -cp "$smoke_dir:$all_jar" OpenDALSmoke
      - name: Upload all-natives local staging directory
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/upload-artifact@v7
        with:
          name: java-all-local-staging
          path: bindings/java/local-staging
          if-no-files-found: error
          include-hidden-files: true

  deploy-staged-snapshots:
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    needs: [assemble-all-natives]
    steps:
      - uses: actions/checkout@v7
        with:
          repository: apache/opendal
          ref: ${{ github.ref }}
      - name: Set up JDK 8
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: "8"
          cache: "maven"
          server-id: apache.releases.https
          server-username: MAVEN_USERNAME
          server-password: MAVEN_CENTRAL_TOKEN
          gpg-private-key: ${{ secrets.GPG_SECRET_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      - name: Prepare environment variables
        run: echo "LOCAL_STAGING_DIR=$HOME/local-staging" >> $GITHUB_ENV

      - name: Download local staging directories
        uses: actions/download-artifact@v8
        with:
          pattern: "*-local-staging"
          path: ~/java-local-staging

      - uses: actions/checkout@v7
        with:
          path: ci-opendal
      - name: Merge staging repositories
        working-directory: ci-opendal
        shell: bash
        run: |
          shopt -s nullglob
          downloaded="$HOME/java-local-staging"
          repositories=("$downloaded"/*-local-staging)
          if [[ "${#repositories[@]}" -ne 8 || ! -d "$downloaded/java-all-local-staging" ]]; then
            echo "Expected local staging artifacts for all seven platforms and the all classifier" >&2
            exit 1
          fi
          # Nexus keeps snapshot files and their index under deferred/.
          if [[ -f "$downloaded/java-all-local-staging/deferred/.index" ]]; then
            python3 ./scripts/merge_local_staging.py "$LOCAL_STAGING_DIR" "${repositories[@]}"
          else
            python3 ./scripts/merge_local_staging.py "$LOCAL_STAGING_DIR/staging" "${repositories[@]/%//staging}"
          fi

      - name: Deploy local staged artifacts
        if: ${{ github.event_name != 'pull_request' }}
        working-directory: bindings/java
        run: |
          ./mvnw org.sonatype.plugins:nexus-staging-maven-plugin:deploy-staged \
            -DaltStagingDirectory=$LOCAL_STAGING_DIR \
            -DserverId=apache.releases.https \
            -DnexusUrl=https://repository.apache.org
        env:
          MAVEN_USERNAME: ${{ secrets.NEXUS_STAGE_DEPLOYER_USER }}
          MAVEN_CENTRAL_TOKEN: ${{ secrets.NEXUS_STAGE_DEPLOYER_PW }}
          MAVEN_GPG_PASSPHRASE: ""
