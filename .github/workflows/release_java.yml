name: Verify Nexus publication permission
on:
  workflow_dispatch:
permissions: {}
jobs:
  verify:
    if: github.repository == 'apache/opendal'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read Nexus permissions with existing CI credentials
        env:
          NEXUS_USER: ${{ secrets.NEXUS_STAGE_DEPLOYER_USER }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_STAGE_DEPLOYER_PW }}
        shell: python
        run: |
          import base64
          import json
          import os
          import sys
          import urllib.error
          import urllib.request

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None

          user = os.environ["NEXUS_USER"]
          password = os.environ["NEXUS_PASSWORD"]
          if not user or not password:
              sys.exit("The configured Nexus credentials are unavailable to this run")
          authorization = base64.b64encode(f"{user}:{password}".encode()).decode()
          opener = urllib.request.build_opener(NoRedirect)
          def get(path):
              request = urllib.request.Request(
                  "https://repository.apache.org/service/local/" + path,
                  headers={"Accept": "application/json", "Authorization": "Basic " + authorization},
                  method="GET",
              )
              try:
                  with opener.open(request, timeout=30) as response:
                      return json.load(response)
              except urllib.error.HTTPError as error:
                  sys.exit(f"Read-only GET {path}: HTTP {error.code}")

          status = get("status?perms=1")["data"]["clientPermissions"]
          permissions = {p["id"]: int(p["value"]) for p in status["permissions"]}
          repository = get("staging/repository/orgapacheopendal-1090")
          print("Staging response keys:", sorted(repository))
          report = {
              "authenticated": status["loggedIn"],
              "can_close_staging": bool(permissions.get("nexus:stagingfinish", 0) & 8),
              "can_promote_staging": bool(permissions.get("nexus:stagingpromote", 0) & 8),
              "opendal_repository_readable": True,
              "repository_state": repository.get("type"),
              "mutations_performed": False,
          }
          print(json.dumps(report, indent=2))
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write("### Nexus permission check\n\n```json\n" + json.dumps(report, indent=2) + "\n```\n")
          if not report["authenticated"] or not report["can_promote_staging"]:
              sys.exit("CI credentials do not advertise the required promotion permission")
