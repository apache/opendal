name: Release Python Binding

on:
  push:
    tags:
      - "*"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/release_python.yml"
      - ".github/workflows/build-python-wheels.yml"
      - ".github/scripts/release_python/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build-python-wheels.yml

  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    needs: [build]
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          merge-multiple: true
          path: bindings/python/dist
      - name: Setup uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - name: Publish to TestPyPI
        if: ${{ startsWith(github.ref, 'refs/tags/') && contains(github.ref, '-') }}
        run: |
          uv publish \
            --trusted-publishing automatic \
            --publish-url https://test.pypi.org/legacy/ \
            --check-url https://test.pypi.org/simple/opendal/ \
            bindings/python/dist/*
      - name: Publish to PyPI
        if: ${{ startsWith(github.ref, 'refs/tags/') && !contains(github.ref, '-') }}
        run: |
          uv publish \
            --trusted-publishing automatic \
            --check-url https://pypi.org/simple/opendal/ \
            bindings/python/dist/*
