name: Release Ruby Binding

on:
  push:
    tags:
      # Triggers on version tags (v0.54.0, v0.54.0-rc.1, etc.)
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/release_ruby.yml"
      - "bindings/ruby/.tool-versions"
      - "bindings/ruby/Rakefile"
      - "bindings/ruby/lib/opendal.rb"
      - "bindings/ruby/opendal.gemspec"
      - "bindings/ruby/test/package/**"
  # Rubygems doesn't have a staging environment, and Rubygems don't provide a
  # public registry. Most gems follow a pre-release tag convention. But
  # OpenDAL doesn't want pre-releases to a publish registry beyond
  # a release process. For now, we can rely on artifacts for testing pre-releases.
  # In the future, we could consider a GitHub private registry for pre-releases.
  #
  # Manual dispatch builds candidates and publishes final tags.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: bindings/ruby

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.summary.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Ruby
        uses: ruby/setup-ruby@be3c7df29b3349ec6bcfc6b4792f1cf9f5237d18 # v1.343.0
        with:
          bundler-cache: true
          working-directory: bindings/ruby

      - name: Build source gem (Ruby-only)
        run: bundle exec rake build

      - name: Show built gems
        run: ls -la pkg/

      - name: Upload artifact (source gem)
        uses: actions/upload-artifact@v7
        with:
          name: opendal-ruby-gem-source
          path: bindings/ruby/pkg/*.gem
          retention-days: 30

      - name: Log Build Summary
        id: summary
        run: |
          # e.g. from `Cargo.toml` to released version:
          # - 0.54.0 -> 0.54.0
          # - 0.54.0-rc.1 -> 0.54.1.pre.rc.1
          VERSION=$(bundle exec rake version)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          {
            echo "## Ruby gem built successfully! 📦"
            echo ""
            printf '**Ref:** %s\n' "${GITHUB_REF_NAME:-$GITHUB_REF}"
            echo "**Version:** $VERSION"
          } >> "$GITHUB_STEP_SUMMARY"

  smoke-test:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Rust toolchain
        uses: ./.github/actions/setup

      - name: Setup Ruby
        uses: ruby/setup-ruby@be3c7df29b3349ec6bcfc6b4792f1cf9f5237d18 # v1.343.0
        with:
          bundler-cache: true # runs 'bundle install' and caches installed gems automatically
          working-directory: bindings/ruby

      - name: Download source gem artifact
        uses: actions/download-artifact@v8
        with:
          name: opendal-ruby-gem-source
          path: bindings/ruby/pkg/

      - name: Smoke test source gem
        run: |
          gem install --local pkg/opendal-*.gem --no-document
          ruby -ropendal <<'EOF'
          op = OpenDal::Operator.new("memory", {})
          op.write("hello.txt", "hello")
          raise "bad read" unless op.read("hello.txt") == "hello"
          EOF

  build-native:
    name: Compile ${{ matrix.target.platform }} / Ruby ${{ matrix.ruby-version }}
    strategy:
      fail-fast: false
      matrix:
        ruby-version: ["3.3", "3.4", "4.0"]
        target:
          - os: ubuntu-24.04
            platform: x86_64-linux
            rust_target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            platform: aarch64-linux
            rust_target: aarch64-unknown-linux-gnu
          # Publish a versionless macOS platform gem. RubyGems matches
          # arm64-darwin against runtime platforms like arm64-darwin23/24/25.
          - os: macos-latest
            platform: arm64-darwin
            rust_target: aarch64-apple-darwin

    runs-on: ${{ matrix.target.os }}

    env:
      CARGO_BUILD_TARGET: ${{ matrix.target.rust_target }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add ${{ matrix.target.rust_target }}

      - name: Setup Ruby
        uses: ruby/setup-ruby@be3c7df29b3349ec6bcfc6b4792f1cf9f5237d18 # v1.343.0
        with:
          ruby-version: ${{ matrix.ruby-version }}
          bundler: "4.1.0"
          bundler-cache: true
          working-directory: bindings/ruby

      - name: Compile the native extension
        run: bundle exec rake native:compile

      - name: Upload native extension
        uses: actions/upload-artifact@v7
        with:
          name: opendal-ruby-extension-${{ matrix.target.platform }}-${{ matrix.ruby-version }}
          path: bindings/ruby/tmp/native/
          if-no-files-found: error
          retention-days: 30

  package-native:
    name: Package ${{ matrix.target.platform }}
    needs: build-native
    strategy:
      fail-fast: false
      matrix:
        target:
          - os: ubuntu-24.04
            platform: x86_64-linux
          - os: ubuntu-24.04-arm
            platform: aarch64-linux
          - os: macos-latest
            platform: arm64-darwin

    runs-on: ${{ matrix.target.os }}

    env:
      OPENDAL_RUBY_PLATFORM: ${{ matrix.target.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Ruby for packaging
        uses: ruby/setup-ruby@be3c7df29b3349ec6bcfc6b4792f1cf9f5237d18 # v1.343.0
        with:
          rubygems: "4.1.0"
          bundler: "4.1.0"
          bundler-cache: true
          working-directory: bindings/ruby

      - name: Download native extensions
        uses: actions/download-artifact@v8
        with:
          pattern: opendal-ruby-extension-${{ matrix.target.platform }}-*
          path: bindings/ruby/tmp/native/
          merge-multiple: true

      - name: Package and verify the native gems
        run: bundle exec rake native:opendal test:package

      - name: Upload native gems
        uses: actions/upload-artifact@v7
        with:
          name: opendal-ruby-gem-${{ matrix.target.platform }}
          path: bindings/ruby/pkg/*.gem
          if-no-files-found: error
          retention-days: 30

  smoke-test-native:
    name: Smoke test ${{ matrix.target.platform }} / Ruby ${{ matrix.ruby-version }} / ${{ matrix.format }}
    needs: package-native
    strategy:
      fail-fast: false
      matrix:
        ruby-version: ["3.3", "3.4", "4.0"]
        format: [conventional, content-addressable]
        target:
          - os: ubuntu-24.04
            platform: x86_64-linux
          - os: ubuntu-24.04-arm
            platform: aarch64-linux
          - os: macos-latest
            platform: arm64-darwin

    runs-on: ${{ matrix.target.os }}

    env:
      OPENDAL_RUBY_PLATFORM: ${{ matrix.target.platform }}
      OPENDAL_RUBY_GEM_FORMAT: ${{ matrix.format }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Ruby for installation
        uses: ruby/setup-ruby@be3c7df29b3349ec6bcfc6b4792f1cf9f5237d18 # v1.343.0
        with:
          ruby-version: ${{ matrix.ruby-version }}
          rubygems: "4.1.0"

      - name: Download native gems
        uses: actions/download-artifact@v8
        with:
          name: opendal-ruby-gem-${{ matrix.target.platform }}
          path: bindings/ruby/pkg/

      - name: Install and smoke test the native gem
        run: ruby test/package/smoke.rb

  publish:
    # RC tags only build artifacts for release verification. RubyGems does not
    # provide a staging registry, so publish only from the final release tag.
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-')

    needs: [build, smoke-test, package-native, smoke-test-native]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Required for RubyGems trusted publishing.

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Ruby and install dependencies
        uses: ruby/setup-ruby@be3c7df29b3349ec6bcfc6b4792f1cf9f5237d18 # v1.343.0
        with:
          rubygems: "4.1.0"
          bundler: "4.1.0"
          bundler-cache: true
          working-directory: bindings/ruby

      - name: Download gem artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: opendal-ruby-gem-*
          path: bindings/ruby/pkg/
          merge-multiple: true

      - name: List downloaded artifacts
        run: |
          echo "Downloaded gems:"
          ls -lh pkg/*.gem

      - name: Release opendal gem
        uses: rubygems/release-gem@5c53f5308233b7c0f47411f0471b3faae6fa57b2 # v1.4.2
        with:
          working-directory: bindings/ruby

      - name: Log Release
        run: |
          {
            echo "## Ruby binding released! 🚀"
            echo ""
            echo "**Version:** $(bundle exec rake version)"
            echo ""
            echo "Check out the [RubyGems page](https://rubygems.org/gems/opendal) for more details."
          } >> "$GITHUB_STEP_SUMMARY"
