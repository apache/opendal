name: Behavior Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cleanup_owned_hf_datasets:
    name: Cleanup two task-owned HF datasets
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Setup 1Password Connect
        shell: bash
        run: |
          echo "::add-mask::${{ secrets.OP_CONNECT_HOST }}"
          echo "::add-mask::${{ secrets.OP_CONNECT_TOKEN }}"
          echo "OP_CONNECT_HOST=${{ secrets.OP_CONNECT_HOST }}" >> "$GITHUB_ENV"
          echo "OP_CONNECT_TOKEN=${{ secrets.OP_CONNECT_TOKEN }}" >> "$GITHUB_ENV"
      - name: Load HF token through the existing CI integration
        uses: 1Password/load-secrets-action@70062d7a876d3eb6334754fa26efd2fbd90c32f2 # v5.0.1
        with:
          export-env: true
        env:
          OPENDAL_HF_TOKEN: op://services/hf/token
      - name: Delete only the two recorded task-owned dataset IDs
        run: node dev/pr_review_ci_hf_owned_cleanup.js
