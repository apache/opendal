name: Task PR6531 OpenDAL AWS validation
run-name: Task PR6531 OpenDAL real AWS request paths

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  aws-bucket-key:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CARGO_BUILD_JOBS: 4
      RUSTFLAGS: -C force-frame-pointers=yes -C debuginfo=1
    steps:
      - uses: actions/checkout@v7
      - name: Build the task-only OpenDAL request driver
        working-directory: core
        run: |
          cargo --version
          rustc --version
          cargo build --locked --example task_pr6531_opendal --features services-s3
      - name: Setup existing AWS S3 fixture
        uses: ./.github/services/s3/aws_s3
        env:
          OP_CONNECT_HOST: ${{ secrets.OP_CONNECT_HOST }}
          OP_CONNECT_TOKEN: ${{ secrets.OP_CONNECT_TOKEN }}
      - name: Verify OpenDAL region fallback and Bucket Key request paths
        run: python3 dev/task_pr6531_opendal_aws.py
      - name: Retain non-secret result and any owned cleanup inventory
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: task-pr6531-opendal-aws
          path: ${{ runner.temp }}/task-pr6531-opendal
          if-no-files-found: warn
