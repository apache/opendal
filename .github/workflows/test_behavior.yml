name: Task PR6531 AWS Bucket Key proof
run-name: Task PR6531 real AWS Bucket Key baseline

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  aws-bucket-key:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OP_CONNECT_HOST: ${{ secrets.OP_CONNECT_HOST }}
      OP_CONNECT_TOKEN: ${{ secrets.OP_CONNECT_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - name: Setup existing AWS S3 fixture
        uses: ./.github/services/s3/aws_s3
      - name: Verify object-level SSE-KMS Bucket Key behavior
        run: python3 dev/task_pr6531_aws_bucket_keys.py
      - name: Retain non-secret result and any owned cleanup inventory
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: task-pr6531-aws-bucket-key
          path: ${{ runner.temp }}/task-pr6531
          if-no-files-found: warn
