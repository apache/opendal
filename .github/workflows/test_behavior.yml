name: Behavior Test

on:
  pull_request:
    branches:
      - main
  workflow_call:
    inputs:
      mode:
        description: "Planner mode (pr, nightly-local, nightly-live)"
        required: true
        type: string
      retry_attempts:
        description: "Number of attempts per setup/job"
        required: false
        type: number
        default: 1
    secrets:
      OP_CONNECT_HOST:
        required: false
      OP_CONNECT_TOKEN:
        required: false
  workflow_dispatch:
    inputs:
      mode:
        description: "Planner mode (pr, nightly-local, nightly-live)"
        required: false
        default: "pr"
        type: choice
        options:
          - pr
          - nightly-local
          - nightly-live
      retry_attempts:
        description: "Number of attempts per setup/job"
        required: false
        default: 1
        type: number

concurrency:
  group: test-behavior-${{ inputs.mode || github.event.inputs.mode || 'pr' }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      plan: ${{ steps.plan.outputs.plan }}
      enable_secrets: ${{ steps.plan.outputs.enable_secrets }}
      retry_attempts: ${{ steps.plan.outputs.retry_attempts }}

    steps:
      - uses: actions/checkout@v7
        with:
          # fetch depth set to 0 to make sure we have correct diff result.
          fetch-depth: 0

      - name: Plan
        id: plan
        run: |
          set -euo pipefail
          event_name="${{ github.event_name }}"
          repository="${{ github.repository }}"
          mode="${{ inputs.mode || github.event.inputs.mode || 'pr' }}"
          retry_attempts="${{ inputs.retry_attempts || github.event.inputs.retry_attempts || 1 }}"
          files_changed=""
          has_secrets="false"

          if [ "$mode" == "nightly-local" ]; then
            has_secrets="false"
          elif [ "$mode" == "nightly-live" ]; then
            if [ "$repository" == "apache/opendal" ]; then
              has_secrets="true"
            fi
          elif [ "$event_name" == "pull_request" ]; then
            pr_head_repo_fork="${{ github.event.pull_request.head.repo.fork }}"
            # Only expose secrets for main repo and non-dependabot runs to mitigate security risks.
            if [ "$pr_head_repo_fork" != "true" ] && [ "${{ github.actor }}" != "dependabot[bot]" ]; then
              has_secrets="true"
            fi

            files_changed=$(git diff --name-only ${{ github.event.pull_request.base.sha }} ${{ github.event.pull_request.head.sha }})
            echo "Files changed:"
            echo "$files_changed"
          elif [ "$event_name" == "workflow_dispatch" ]; then
            if [ "$repository" == "apache/opendal" ]; then
              has_secrets="true"
            fi
            git fetch --no-tags --prune --depth=1 origin main
            files_changed=$(git diff --name-only origin/main HEAD)
            echo "Files changed (main..HEAD):"
            echo "$files_changed"
          fi

          export GITHUB_HAS_SECRETS=$has_secrets

          PLAN=$(./.github/scripts/test_behavior/plan.py --mode "$mode" -- $files_changed)
          echo "Mode: $mode (enable_secrets=$has_secrets, retry_attempts=$retry_attempts)"
          echo "Plan:"
          echo "$PLAN" | jq .
          echo "plan=$PLAN" >> "$GITHUB_OUTPUT"
          echo "enable_secrets=$has_secrets" >> "$GITHUB_OUTPUT"
          echo "retry_attempts=$retry_attempts" >> "$GITHUB_OUTPUT"

  test_core:
    name: core / ${{ matrix.os }}
    needs: [ plan ]
    if: fromJson(needs.plan.outputs.plan).components.core
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.plan.outputs.plan).core }}
    uses: ./.github/workflows/test_behavior_core.yml
    with:
      os: ${{ matrix.os }}
      cases: ${{ toJson(matrix.cases) }}
      enable_secrets: ${{ needs.plan.outputs.enable_secrets == 'true' }}
      retry_attempts: ${{ fromJson(needs.plan.outputs.retry_attempts) }}
    secrets:
      OP_CONNECT_HOST: ${{ secrets.OP_CONNECT_HOST }}
      OP_CONNECT_TOKEN: ${{ secrets.OP_CONNECT_TOKEN }}

  test_binding_java:
