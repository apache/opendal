name: Behavior Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Upstream PR number (for mirrored runs)"
        required: false
        type: string
      selector:
        description: "Optional registered behavior-test selector"
        required: false
        default: ""
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      plan: ${{ steps.plan.outputs.plan }}

    steps:
      - uses: actions/checkout@v7
        with:
          # fetch depth set to 0 to make sure we have correct diff result.
          fetch-depth: 0

      - name: Plan
        id: plan
        env:
          TEST_SELECTOR: ${{ inputs.selector }}
        run: |
          event_name="${{ github.event_name }}"
          repository="${{ github.repository }}"
          files_changed=""
          has_secrets="false"
          is_push="false"

          # Handle event-specific logic
          if [ "$event_name" == "push" ]; then
            if [ "$repository" == "apache/opendal" ]; then
              is_push="true"
              has_secrets="true"
            fi
          elif [ "$event_name" == "pull_request" ]; then
            pr_head_repo_fork="${{ github.event.pull_request.head.repo.fork }}"
            # Only expose secrets for main repo and non-dependabot runs to mitigate security risks
            if [ "$pr_head_repo_fork" != "true" ] && [ "${{ github.actor }}" != "dependabot[bot]" ]; then
              has_secrets="true"
            fi

            files_changed=$(git diff --name-only ${{ github.event.pull_request.base.sha }} ${{ github.event.pull_request.head.sha }})
            echo "Files changed:"
            echo "$files_changed"
          elif [ "$event_name" == "workflow_dispatch" ]; then
            # Mirror runs are explicitly triggered by maintainers; allow secrets.
            has_secrets="true"
            # Compare against main to infer affected components.
            git fetch --no-tags --prune --depth=1 origin main
            files_changed=$(git diff --name-only origin/main HEAD)
            echo "Files changed (main..HEAD):"
            echo "$files_changed"
          fi

          # Export variables
          export GITHUB_HAS_SECRETS=$has_secrets
          export GITHUB_IS_PUSH=$is_push

          # Run the workflow planner script
          PLAN=$(./.github/scripts/test_behavior/plan.py $files_changed)
          if [ "$TEST_SELECTOR" == "gcs-versioned-presign" ]; then
            PLAN=$(printf '%s' "$PLAN" | jq -c '
              .components |= with_entries(.value = false)
              | .components.core = true
              | .core = [{
                  "os": "ubuntu-latest",
                  "cases": [{
                    "setups": ["gcs"],
                    "service": "gcs",
                    "feature": "services-gcs"
                  }]
                }]
            ')
          fi
          echo "Plan:"
          echo "$PLAN" | jq .
          echo "plan=$PLAN" >> $GITHUB_OUTPUT

  test_core:
    name: core / ${{ matrix.os }}
    needs: [ plan ]
    if: fromJson(needs.plan.outputs.plan).components.core
    secrets: inherit
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.plan.outputs.plan).core }}
    uses: ./.github/workflows/test_behavior_core.yml
    with:
      os: ${{ matrix.os }}
      cases: ${{ toJson(matrix.cases) }}

  test_gcs_versioned_presign:
    name: gcs / versioned presign
    needs: [ plan ]
    if: inputs.selector == 'gcs-versioned-presign'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust toolchain
        uses: ./.github/actions/setup
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup 1Password Connect
        shell: bash
        env:
          OP_CONNECT_HOST: ${{ secrets.OP_CONNECT_HOST }}
          OP_CONNECT_TOKEN: ${{ secrets.OP_CONNECT_TOKEN }}
        run: |
          printf '::add-mask::%s\n' "$OP_CONNECT_HOST"
          printf '::add-mask::%s\n' "$OP_CONNECT_TOKEN"
          printf 'OP_CONNECT_HOST=%s\n' "$OP_CONNECT_HOST" >> "$GITHUB_ENV"
          printf 'OP_CONNECT_TOKEN=%s\n' "$OP_CONNECT_TOKEN" >> "$GITHUB_ENV"

      - name: Setup GCS
        uses: ./.github/services/gcs/gcs

      - name: Test versioned presign GET and HEAD
        working-directory: core
        run: cargo test --locked --test versioned_presign --features tests,services-gcs -- --nocapture
        env:
          OPENDAL_TEST: gcs
          OPENDAL_DISABLE_RANDOM_ROOT: "true"
          RUST_LOG: off

  test_binding_java:
    name: binding_java / ${{ matrix.os }}
    needs: [ plan ]
    if: fromJson(needs.plan.outputs.plan).components.binding_java
    secrets: inherit
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.plan.outputs.plan).binding_java }}
    uses: ./.github/workflows/test_behavior_binding_java.yml
    with:
      os: ${{ matrix.os }}
      cases: ${{ toJson(matrix.cases) }}

  test_binding_python:
