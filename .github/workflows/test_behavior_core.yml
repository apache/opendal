name: Behavior Test Core

on:
  workflow_call:
    inputs:
      os:
        required: true
        type: string
      cases:
        required: true
        type: string

jobs:
  test:
    name: ${{ matrix.cases.service }}
    runs-on: ${{ inputs.os }}
    strategy:
      fail-fast: false
      matrix:
        cases: ${{ fromJson(inputs.cases) }}
    steps:
      - uses: actions/checkout@v7
      - name: Setup Rust toolchain
        uses: ./.github/actions/setup
        with:
          need-protoc: true
          need-rocksdb: ${{ matrix.cases.service != 'hf3fs' }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup 1Password Connect
        shell: bash
        run: |
          echo "::add-mask::${{ secrets.OP_CONNECT_HOST }}"
          echo "::add-mask::${{ secrets.OP_CONNECT_TOKEN }}"
          echo "OP_CONNECT_HOST=${{ secrets.OP_CONNECT_HOST }}" >> "$GITHUB_ENV"
          echo "OP_CONNECT_TOKEN=${{ secrets.OP_CONNECT_TOKEN }}" >> "$GITHUB_ENV"

      - name: Test Core
        uses: ./.github/actions/test_behavior_core
        with:
          setups: ${{ join(matrix.cases.setups, ',') }}
          service: ${{ matrix.cases.service }}
          feature: ${{ matrix.cases.feature }}

      - name: Stop 3FS
        if: always() && matrix.cases.service == 'hf3fs'
        shell: bash
        run: |
          sudo journalctl -u opendal-hf3fs --no-pager > "$RUNNER_TEMP/hf3fs-journal.log" 2>&1 || true
          sudo systemctl stop opendal-hf3fs || true
          fusermount3 -u "$RUNNER_TEMP/hf3fs-cluster/mnt" 2>/dev/null || true
          sudo rdma link delete opendal_rxe 2>/dev/null || true

      - name: Upload 3FS logs
        if: always() && matrix.cases.service == 'hf3fs'
        uses: actions/upload-artifact@v7
        with:
          name: hf3fs-logs
          path: |
            ${{ runner.temp }}/hf3fs-journal.log
            ${{ runner.temp }}/hf3fs-cluster/log
