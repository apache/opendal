name: Behavior Test Core

on:
  workflow_call:
    inputs:
      os:
        required: true
        type: string
      cases:
        required: true
        type: string
      enable_secrets:
        required: false
        type: boolean
        default: false
      retry_attempts:
        required: false
        type: number
        default: 1
    secrets:
      OP_CONNECT_HOST:
        required: false
      OP_CONNECT_TOKEN:
        required: false

jobs:
  test:
    name: ${{ matrix.cases.label || matrix.cases.service }}
    runs-on: ${{ inputs.os }}
    strategy:
      fail-fast: false
      matrix:
        cases: ${{ fromJson(inputs.cases) }}
    steps:
      - uses: actions/checkout@v7
      - name: Setup Rust toolchain
        uses: ./.github/actions/setup
        with:
          need-protoc: true
          need-rocksdb: true
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup 1Password Connect
        if: inputs.enable_secrets
        shell: bash
        run: |
          echo "::add-mask::${{ secrets.OP_CONNECT_HOST }}"
          echo "::add-mask::${{ secrets.OP_CONNECT_TOKEN }}"
          echo "OP_CONNECT_HOST=${{ secrets.OP_CONNECT_HOST }}" >> "$GITHUB_ENV"
          echo "OP_CONNECT_TOKEN=${{ secrets.OP_CONNECT_TOKEN }}" >> "$GITHUB_ENV"

      - name: Test Core
        id: test
        continue-on-error: ${{ inputs.retry_attempts > 1 }}
        uses: ./.github/actions/test_behavior_core
        with:
          setups: ${{ join(matrix.cases.setups, ',') }}
          service: ${{ matrix.cases.service }}
          feature: ${{ matrix.cases.feature }}
        env:
          # Forward the workflow token only for live/secret-enabled runs so
          # deterministic local runs never inject external API tokens.
          GITHUB_TOKEN: ${{ inputs.enable_secrets && secrets.GITHUB_TOKEN || '' }}

      - name: Retry Test Core
        if: steps.test.outcome == 'failure' && inputs.retry_attempts > 1
        uses: ./.github/actions/test_behavior_core
        with:
          setups: ${{ join(matrix.cases.setups, ',') }}
          service: ${{ matrix.cases.service }}
          feature: ${{ matrix.cases.feature }}
        env:
          GITHUB_TOKEN: ${{ inputs.enable_secrets && secrets.GITHUB_TOKEN || '' }}
