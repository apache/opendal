name: Edge Test

on:
  pull_request:
    branches:
      - main
    paths:
      - "core/Cargo.toml"
      - "core/Cargo.lock"
      - "core/core/Cargo.toml"
      - "core/core/src/**"
      - "core/layers/**"
      - "core/testkit/**"
      - "!core/core/src/docs/**"
      - "core/edge/file_write_on_full_disk/**"
      - "core/edge/memory_behavior_on_wasm/**"
      - "core/edge/opfs_wasm32/**"
      - "core/edge/s3_read_on_wasm/**"
      - "core/services/fs/**"
      - "core/services/opfs/**"
      - "core/services/s3/**"
      - "core/src/**"
      - "core/tests/behavior/**"
      - "rust-toolchain.toml"
      - ".github/actions/setup/**"
      - ".github/workflows/test_edge.yml"
  workflow_call:

permissions:
  contents: read

concurrency:
  group: test-edge-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test_file_write_on_full_disk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Create disk image
        run: |
          fallocate -l 512K disk.img
          mkfs disk.img

      - name: Mount disk image
        run: |
          mkdir /tmp/test_dir
          sudo mount -o loop disk.img /tmp/test_dir

      - name: Set permissions
        run: sudo chmod a+wr /tmp/test_dir

      - name: Test
        working-directory: core/edge/file_write_on_full_disk
        run: cargo run
        env:
          OPENDAL_FS_ROOT: /tmp/test_dir

  test_opfs_on_wasm:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: core/edge/opfs_wasm32

    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust toolchain
        uses: ./.github/actions/setup

      - name: Install WASM target and wasm-pack
        shell: bash
        run: |
          rustup target add wasm32-unknown-unknown
          wasm_pack_version=v0.15.1
          archive="wasm-pack-${wasm_pack_version}-x86_64-unknown-linux-musl.tar.gz"
          curl -fsSL --retry 3 "https://github.com/wasm-bindgen/wasm-pack/releases/download/${wasm_pack_version}/${archive}" \
            | tar -xz -C "$RUNNER_TEMP" --strip-components=1 --wildcards '*/wasm-pack'
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Test on the browser main thread
        run: wasm-pack test --headless --chrome --chromedriver "$CHROMEWEBDRIVER/chromedriver" -- --locked

      - name: Test in a dedicated worker
        run: wasm-pack test --headless --chrome --chromedriver "$CHROMEWEBDRIVER/chromedriver" -- --locked --features worker

  test_memory_behavior_on_wasm:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: core/edge/memory_behavior_on_wasm

    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust toolchain
        uses: ./.github/actions/setup

      - name: Install WASM target and wasm-pack
        shell: bash
        run: |
          rustup target add wasm32-unknown-unknown
          wasm_pack_version=v0.15.1
          archive="wasm-pack-${wasm_pack_version}-x86_64-unknown-linux-musl.tar.gz"
          curl -fsSL --retry 3 "https://github.com/wasm-bindgen/wasm-pack/releases/download/${wasm_pack_version}/${archive}" \
            | tar -xz -C "$RUNNER_TEMP" --strip-components=1 --wildcards '*/wasm-pack'
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Test Memory behavior in headless Chrome
        run: wasm-pack test --headless --chrome --chromedriver "$CHROMEWEBDRIVER/chromedriver" -- --locked --test browser

  test_s3_read_on_wasm:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: core/edge/s3_read_on_wasm

    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust toolchain
        uses: ./.github/actions/setup

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install WASM target and wasm-pack
        shell: bash
        run: |
          rustup target add wasm32-unknown-unknown
          wasm_pack_version=v0.15.1
          archive="wasm-pack-${wasm_pack_version}-x86_64-unknown-linux-musl.tar.gz"
          curl -fsSL --retry 3 "https://github.com/wasm-bindgen/wasm-pack/releases/download/${wasm_pack_version}/${archive}" \
            | tar -xz -C "$RUNNER_TEMP" --strip-components=1 --wildcards '*/wasm-pack'
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Setup Silo Server
        shell: bash
        working-directory: fixtures/s3
        run: docker compose -f docker-compose-silo.yml up -d --wait

      - name: Setup test bucket
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: "minioadmin"
          AWS_SECRET_ACCESS_KEY: "minioadmin"
          AWS_EC2_METADATA_DISABLED: "true"
        run: aws --endpoint-url http://127.0.0.1:9000/ s3 mb s3://test

      - name: Test in Node.js
        run: wasm-pack test --node -- --locked --test node

      - name: Test in headless Chrome
        run: wasm-pack test --headless --chrome --chromedriver "$CHROMEWEBDRIVER/chromedriver" -- --locked --test browser
