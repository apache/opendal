name: Fuzz Test

on:
  pull_request:
    branches:
      - main
    paths:
      - "core/Cargo.toml"
      - "core/Cargo.lock"
      - "core/core/Cargo.toml"
      - "core/core/src/**"
      - "core/fuzz/**"
      - "core/layers/**"
      - "core/services/**"
      - "core/testkit/**"
      - "!core/core/src/docs/**"
      - ".github/actions/fuzz_test/**"
      - ".github/workflows/test_fuzz.yml"
  schedule:
    # Daily 02:30 Asia/Shanghai (18:30 UTC).
    - cron: '30 18 * * *'
  workflow_dispatch:
    inputs:
      max_total_time:
        description: "Maximum fuzz duration per target in seconds"
        required: false
        default: "600"
        type: string

permissions:
  contents: read

concurrency:
  group: test-fuzz-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  RUST_TOOLCHAIN: nightly-2025-10-10

jobs:
  fuzz:
    if: github.event_name != 'schedule' || github.repository == 'apache/opendal'
    name: ${{ matrix.cases.service }} / ${{ matrix.cases.setup }} / ${{ matrix.target }}
    # Fuzz targets link against libFuzzer from LLVM 14, which is not
    # packaged on the default ubuntu-26.04 runner image.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target: ["fuzz_reader", "fuzz_writer"]
        cases:
          - { service: "memory", setup: "memory" }
          - { service: "fs", setup: "local_fs" }
          - { service: "s3", setup: "0_silo_s3" }
          - { service: "azblob", setup: "azurite_azblob" }
    steps:
      - uses: actions/checkout@v7
      - name: Setup Rust toolchain
        uses: ./.github/actions/setup
      - name: Set Rust Fuzz
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuzzer-14-dev
          rustup install ${{ env.RUST_TOOLCHAIN }}
          cargo +${{ env.RUST_TOOLCHAIN }} install cargo-fuzz
      - name: Fuzz
        uses: ./.github/actions/fuzz_test
        env:
          CUSTOM_LIBFUZZER_PATH: /usr/lib/llvm-14/lib/libFuzzer.a
        with:
          setup: ${{ matrix.cases.setup }}
          service: ${{ matrix.cases.service }}
          target: ${{ matrix.target }}
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          max-total-time: ${{ github.event.inputs.max_total_time || (github.event_name == 'schedule' && '600' || '120') }}
      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-artifacts-${{ matrix.cases.service }}-${{ matrix.cases.setup }}-${{ matrix.target }}
          path: core/fuzz/artifacts/
          if-no-files-found: ignore
