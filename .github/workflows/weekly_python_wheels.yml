name: Weekly Python Binding Wheels

on:
  schedule:
    # 00:00 Thursday in UTC+8. GitHub schedules cron in UTC.
    - cron: "0 16 * * 3"
  workflow_dispatch:
    inputs:
      publish-test-pypi:
        description: "Publish the development wheels to TestPyPI"
        type: boolean
        default: false

concurrency:
  group: weekly-python-binding-wheels
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build-python-wheels.yml
    with:
      dev: true

  publish:
    name: Publish
    runs-on: ubuntu-latest
    needs: [build]
    if: ${{ github.repository == 'apache/opendal' && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.publish-test-pypi)) }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          merge-multiple: true
          path: bindings/python/dist
      - name: Setup uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - name: Publish to TestPyPI
        run: |
          uv publish \
            --trusted-publishing automatic \
            --publish-url https://test.pypi.org/legacy/ \
            --check-url https://test.pypi.org/simple/opendal/ \
            bindings/python/dist/*
