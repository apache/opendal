name: Weekly source release

on:
  push:
    branches: [main]
  schedule:
    - cron: '7 0 * * 5'
  workflow_dispatch:
  pull_request:
    types: [closed]
    branches: ['release-candidates/**']

permissions:
  contents: read

concurrency:
  group: weekly-source-release
  cancel-in-progress: false

jobs:
  prepare:
    if: github.repository == 'apache/opendal' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Select Friday cutoff and release baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cutoff=$(python3 - <<'PYTHON'
          import datetime as d
          now = d.datetime.now(d.timezone.utc)
          friday = (now - d.timedelta(days=(now.weekday() - 4) % 7)).replace(hour=0, minute=0, second=0, microsecond=0)
          print(friday.strftime("%Y-%m-%dT%H:%M:%SZ"))
          PYTHON
          )
          # Push run timestamps record arrival on main, unlike commit dates.
          sha=$(gh api --paginate --slurp 'repos/apache/opendal/actions/workflows/weekly_release.yml/runs?event=push&branch=main&per_page=100' |
            jq -er --arg cutoff "$cutoff" '[.[].workflow_runs[] | select(.created_at <= $cutoff)] | max_by(.created_at, .id).head_sha // error("no push recorded before cutoff")')
          baseline=$(git describe --tags --abbrev=0 --match 'v[0-9]*' --exclude '*-*' "$sha")
          git checkout --detach "$sha"
          branch="release-candidates/weekly-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          {
            echo "CUTOFF_SHA=$sha"
            echo "BASELINE=$baseline"
            echo "CANDIDATE_BRANCH=$branch"
          } >> "$GITHUB_ENV"
      - name: Prepare versions with existing release tools
        run: |
          cargo run --quiet --manifest-path dev/Cargo.toml -- update-version --baseline "$BASELINE" --patch
          while IFS= read -r lock; do
            cargo update --workspace --manifest-path "${lock%Cargo.lock}Cargo.toml"
          done < <(git ls-files '*Cargo.lock')
          python3 scripts/dependencies.py generate
          version=$(cargo run --quiet --manifest-path dev/Cargo.toml -- release-packages | jq -er '.[] | select(.path == "core") | .version')
          export RC="$version-rc.$((GITHUB_RUN_ID * 1000 + GITHUB_RUN_ATTEMPT))"
          echo "RC=$RC" >> "$GITHUB_ENV"
          python3 - <<'PYTHON'
          import os
          from pathlib import Path
          p = Path("CHANGELOG.md")
          p.write_text(f"# v{os.environ['RC'].split('-rc.')[0]}\n\n- [Changes since {os.environ['BASELINE']}](https://github.com/apache/opendal/compare/{os.environ['BASELINE']}...{os.environ['CUTOFF_SHA']})\n\n" + p.read_text())
          PYTHON
      - name: Open candidate version PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'OpenDAL Release'
          git config user.email 'dev@opendal.apache.org'
          git add --all
          git -c commit.gpgsign=false commit -m "Prepare $RC"
          git -c 'credential.helper=!gh auth git-credential' push origin "$CUTOFF_SHA:refs/heads/$CANDIDATE_BRANCH" "HEAD:refs/heads/$CANDIDATE_BRANCH-bump"
          cat > "$RUNNER_TEMP/weekly-pr.md" <<EOF
          Prepare $RC from Friday 00:00 UTC cutoff \`$CUTOFF_SHA\`, using final release \`$BASELINE\` as the version baseline.

          Review package versions, compatibility and changelog. Merge into this candidate branch to run the existing compose workflow. Then follow the existing ATR release procedure to verify the candidate, start the vote and finish publication.

          Before merging, ensure no other candidate is being voted on or published. Failed preparation can be abandoned and started again with a new workflow run.
          EOF
          gh pr create --repo apache/opendal --base "$CANDIDATE_BRANCH" --head "$CANDIDATE_BRANCH-bump" --title "chore(release): prepare $RC" --body-file "$RUNNER_TEMP/weekly-pr.md"

  candidate:
    if: github.repository == 'apache/opendal' && github.event_name == 'pull_request' && github.event.pull_request.merged
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.candidate.outputs.sha }}
      rc: ${{ steps.candidate.outputs.rc }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          persist-credentials: false
      - name: Select reviewed candidate
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch=$(jq -r '.pull_request.base.ref' "$GITHUB_EVENT_PATH")
          jq -e --arg branch "$branch" '.pull_request | .head.repo.full_name == "apache/opendal" and .head.ref == ($branch + "-bump")' "$GITHUB_EVENT_PATH"
          [[ "$branch" =~ ^release-candidates/weekly-([0-9]+)-([0-9]+)$ ]]
          attempt="$((BASH_REMATCH[1] * 1000 + BASH_REMATCH[2]))"
          sha=$(git rev-parse HEAD)
          test "$(gh api "repos/apache/opendal/git/ref/heads/$branch" --jq '.object.sha')" = "$sha"
          version=$(sed -n 's/.*let core = make_package("core", "\([0-9.]*\)".*/\1/p' dev/src/release/package.rs)
          rc="$version-rc.$attempt"
          gh api --method POST repos/apache/opendal/git/refs -f ref="refs/tags/v$rc" -f sha="$sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "rc=$rc" >> "$GITHUB_OUTPUT"

  compose:
    needs: candidate
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/release-compose.yml
    with:
      candidate: ${{ needs.candidate.outputs.sha }}
      rc: ${{ needs.candidate.outputs.rc }}
    secrets:
      GPG_SECRET_KEY: ${{ secrets.GPG_SECRET_KEY }}
