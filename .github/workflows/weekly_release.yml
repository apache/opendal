name: Weekly source release

on:
  push:
    branches: [main]
  schedule:
    - cron: '7 0 * * 5'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: weekly-source-release
  cancel-in-progress: false

jobs:
  prepare:
    if: github.repository == 'apache/opendal' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.candidate.outputs.sha }}
      rc: ${{ steps.candidate.outputs.rc }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          need-deny: true
      - name: Select source commit and release baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha="$GITHUB_SHA"
          if [ "$GITHUB_EVENT_NAME" = schedule ]; then
            cutoff=$(python3 - <<'PYTHON'
          import datetime as d
          now = d.datetime.now(d.timezone.utc)
          friday = (now - d.timedelta(days=(now.weekday() - 4) % 7)).replace(hour=0, minute=0, second=0, microsecond=0)
          print(friday.strftime("%Y-%m-%dT%H:%M:%SZ"))
          PYTHON
            )
            # Push run timestamps record arrival on main, unlike commit dates.
            sha=$(gh api --paginate --slurp 'repos/apache/opendal/actions/workflows/weekly_release.yml/runs?event=push&branch=main&per_page=100' |
              jq -er --arg cutoff "$cutoff" '[.[].workflow_runs[] | select(.created_at <= $cutoff)] | max_by(.created_at, .id).head_sha // error("no push recorded before cutoff")')
          fi
          baseline=$(git describe --tags --abbrev=0 --match 'v[0-9]*' --exclude '*-*' "$sha")
          git checkout --detach "$sha"
          branch="release-candidates/weekly-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          {
            echo "SOURCE_SHA=$sha"
            echo "BASELINE=$baseline"
            echo "CANDIDATE_BRANCH=$branch"
          } >> "$GITHUB_ENV"
      - name: Prepare versions with existing release tools
        run: |
          cargo run --quiet --manifest-path dev/Cargo.toml -- update-version --baseline "$BASELINE" --patch
          while IFS= read -r lock; do
            cargo update --workspace --manifest-path "${lock%Cargo.lock}Cargo.toml"
          done < <(git ls-files '*Cargo.lock')
          python3 scripts/dependencies.py generate
          version=$(cargo run --quiet --manifest-path dev/Cargo.toml -- release-packages | jq -er '.[] | select(.path == "core") | .version')
          # Choose the first unused RC number, including manually prepared tags.
          rc_number=1
          while git show-ref --verify --quiet "refs/tags/v$version-rc.$rc_number"; do
            rc_number=$((rc_number + 1))
          done
          export RC="$version-rc.$rc_number"
          echo "RC=$RC" >> "$GITHUB_ENV"
          python3 - <<'PYTHON'
          import os
          from pathlib import Path
          p = Path("CHANGELOG.md")
          p.write_text(f"# v{os.environ['RC'].split('-rc.')[0]}\n\n- [Changes since {os.environ['BASELINE']}](https://github.com/apache/opendal/compare/{os.environ['BASELINE']}...{os.environ['SOURCE_SHA']})\n\n" + p.read_text())
          PYTHON
      - name: Push prepared candidate
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'OpenDAL Release'
          git config user.email 'dev@opendal.apache.org'
          git add --all
          git -c commit.gpgsign=false commit -m "Prepare $RC"
          git -c tag.gpgsign=false tag "v$RC"
          git -c 'credential.helper=!gh auth git-credential' push --atomic origin "HEAD:refs/heads/$CANDIDATE_BRANCH" "refs/tags/v$RC"
          {
            echo "sha=$(git rev-parse HEAD)"
            echo "rc=$RC"
          } >> "$GITHUB_OUTPUT"
          echo "Prepared $RC on $CANDIDATE_BRANCH from source $SOURCE_SHA. Continuing to ATR compose." >> "$GITHUB_STEP_SUMMARY"

  compose:
    needs: prepare
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/release-compose.yml
    with:
      candidate: ${{ needs.prepare.outputs.sha }}
      rc: ${{ needs.prepare.outputs.rc }}
    secrets:
      GPG_SECRET_KEY: ${{ secrets.GPG_SECRET_KEY }}

  builds:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Dispatch existing RC workflows
        env:
          GH_TOKEN: ${{ github.token }}
          RC: ${{ needs.prepare.outputs.rc }}
          SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          # GITHUB_TOKEN pushes do not trigger the existing tag workflows.
          for workflow in ci_bindings_{c,cpp,d,dart,dotnet,go,haskell,java,lua,moonbit,nodejs,ocaml,php,ruby,swift,zig}.yml release_{dart,dotnet,java,nodejs,python,ruby,rust}.yml docs.yml; do
            state=$(gh api "repos/apache/opendal/actions/workflows/$workflow" --jq .state)
            case "$state" in
              disabled_*)
                echo "Skipped $workflow ($state)." >> "$GITHUB_STEP_SUMMARY"
                continue
                ;;
            esac
            # Reuse runs already accepted before a partial dispatch failure.
            count=$(gh run list --repo apache/opendal --workflow "$workflow" --commit "$SHA" --event workflow_dispatch --limit 1 --json databaseId --jq length)
            if [ "$count" -gt 0 ]; then continue; fi
            args=()
            case "$workflow" in
              release_nodejs.yml) args=(-f nodejs-publish=false -f nodejs-publish-dry-run=false) ;;
              release_dotnet.yml) args=(-f release_type=none) ;;
              docs.yml) args=(-f release_version="v$RC" -f deploy-nightlies=false) ;;
            esac
            gh workflow run "$workflow" --repo apache/opendal --ref "v$RC" "${args[@]}"
          done

  notify:
    needs: [prepare, compose, builds]
    runs-on: ubuntu-latest
    permissions:
      discussions: write
      contents: read
    steps:
      - name: Announce staged candidate for RM verification
        env:
          GH_TOKEN: ${{ github.token }}
          RC: ${{ needs.prepare.outputs.rc }}
          SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          title="Source candidate ready: $RC"
          # GraphQL variables must reach the API without shell expansion.
          # shellcheck disable=SC2016
          gh api graphql --paginate --slurp -f query='
            query($endCursor: String) {
              repository(owner: "apache", name: "opendal") {
                id
                discussionCategories(first: 100) { nodes { id name } }
                discussions(first: 100, after: $endCursor) {
                  nodes { title url }
                  pageInfo { hasNextPage endCursor }
                }
              }
            }' > "$RUNNER_TEMP/discussions.json"
          existing=$(jq -r --arg title "$title" '[.[].data.repository.discussions.nodes[] | select(.title == $title) | .url][0] // empty' "$RUNNER_TEMP/discussions.json")
          if [ -n "$existing" ]; then
            echo "$existing" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          repository=$(jq -er '.[0].data.repository.id' "$RUNNER_TEMP/discussions.json")
          category=$(jq -er '.[0].data.repository.discussionCategories.nodes[] | select(.name == "General") | .id' "$RUNNER_TEMP/discussions.json")
          cat > "$RUNNER_TEMP/candidate-notice.md" <<EOF
          Source candidate **$RC** has been built, signed and uploaded to ATR.

          - [ATR candidate](https://releases.apache.org/compose/opendal/$RC)
          - [RC tag](https://github.com/apache/opendal/releases/tag/v$RC), commit: \`$SHA\`
          - [Source build and signed artifacts](https://github.com/apache/opendal/actions/runs/$GITHUB_RUN_ID)
          - [RC builds and binding checks](https://github.com/apache/opendal/actions?query=branch%3Av$RC)

          RC build workflows have been dispatched; this notice does not mean they have passed.
          Release manager: check their results and staging outputs, inspect ATR checks, and independently verify the candidate before starting the formal vote. This Discussion is a preparation notice, not a vote.
          EOF
          # shellcheck disable=SC2016
          gh api graphql -f query='
            mutation($repository: ID!, $category: ID!, $title: String!, $body: String!) {
              createDiscussion(input: {repositoryId: $repository, categoryId: $category, title: $title, body: $body}) {
                discussion { url }
              }
            }' -f repository="$repository" -f category="$category" -f title="$title" -F body=@"$RUNNER_TEMP/candidate-notice.md" --jq '.data.createDiscussion.discussion.url' >> "$GITHUB_STEP_SUMMARY"
