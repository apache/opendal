[workspace]
members = [
  "base",
  "bridge",
  "fs-capsule",
  "fs-direct",
  "mime-capsule",
  "mime-direct",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "Apache-2.0"
publish = false
rust-version = "1.91"
version = "0.0.0"

[workspace.dependencies]
opendal-core = { path = "../../../../core/core", features = ["blocking"] }
opendal-layer-mime-guess = { path = "../../../../core/layers/mime-guess" }
opendal-service-fs = { path = "../../../../core/services/fs" }
pin-project = "1"
pyo3 = { version = "0.29.0", features = ["extension-module"] }
pyo3-comparison-bridge = { path = "bridge" }
tokio = { version = "1", features = ["fs", "rt-multi-thread"] }
