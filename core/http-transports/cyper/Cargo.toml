[package]
description = "Apache OpenDAL Cyper HTTP transport implementation"
name = "opendal-http-transport-cyper"
readme = "README.md"

authors = { workspace = true }
edition = { workspace = true }
homepage = { workspace = true }
license = { workspace = true }
repository = { workspace = true }
rust-version = "1.95"
version = { workspace = true }

[package.metadata.docs.rs]
all-features = true

[features]
default = ["rustls"]
# Use platform TLS via Cyper's native-tls feature.
native-tls = ["cyper/native-tls"]
# Use Rustls with platform certificate verification.
rustls = ["cyper/rustls", "dep:rustls", "dep:rustls-platform-verifier"]

[dependencies]
async-channel = "2.5"
compio = { version = "0.19", default-features = false, features = ["runtime"] }
cyper = { workspace = true, features = ["stream"] }
futures = { workspace = true, features = ["std"] }
http = { workspace = true }
opendal-core = { path = "../../core", version = "0.59.5", default-features = false }
rustls = { version = "0.23", default-features = false, features = [
  "ring",
], optional = true }
rustls-platform-verifier = { version = "0.7", optional = true }

[dev-dependencies]
compio = { version = "0.19", default-features = false, features = [
  "polling",
  "time",
] }
opendal-service-http = { path = "../../services/http", version = "0.59.5" }
