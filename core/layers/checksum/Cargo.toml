[package]
description = "Apache OpenDAL checksum layer"
name = "opendal-layer-checksum"
publish = false

authors = { workspace = true }
edition = { workspace = true }
homepage = { workspace = true }
license = { workspace = true }
repository = { workspace = true }
rust-version = { workspace = true }
version = { workspace = true }

[dependencies]
crc-fast = "1.9.0"
md-5 = "0.11.0"
opendal-core = { path = "../../core", version = "0.59.5", default-features = false }
sha2 = { workspace = true }

[dev-dependencies]
futures = { workspace = true }
opendal-executor-tokio = { path = "../../executors/tokio", version = "0.59.5" }
opendal-layer-retry = { path = "../retry", version = "0.59.5" }
opendal-layer-route = { path = "../route", version = "0.59.5" }
tokio = { workspace = true, features = ["macros", "rt"] }
