[package]
description = "Apache OpenDAL HDFS Native service implementation"
name = "opendal-service-hdfs-native"
readme = "README.md"

authors = { workspace = true }
edition = { workspace = true }
homepage = { workspace = true }
license = { workspace = true }
repository = { workspace = true }
rust-version = { workspace = true }
version = { workspace = true }

[package.metadata.docs.rs]
all-features = true

[features]
# Hadoop KMS client for HDFS encryption zones. See `src/docs.md`.
kms = ["hdfs-native/kms"]
kms-native-tls = ["hdfs-native/kms-native-tls"]
kms-rustls-no-provider = ["hdfs-native/kms-rustls-no-provider"]
kms-rustls-tls = ["hdfs-native/kms-rustls-tls"]

[dependencies]
asyncband = { workspace = true, features = ["once-cell"] }
bytes = { workspace = true }
futures = { workspace = true }
hdfs-native = { version = "0.15.1" }
log = { workspace = true }
opendal-core = { path = "../../core", version = "0.59.5", default-features = false }
serde = { workspace = true, features = ["derive"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
