[workspace]

[package]
edition = "2024"
name = "opendal-examples-fips-tls"
publish = false
rust-version = "1.91"
version = "0.1.0"

[dependencies]
opendal = { path = "../../../core", default-features = false, features = [
  "http-transport-reqwest-rustls-no-provider",
  "services-http",
] }
opendal-http-transport-reqwest = { path = "../../../core/http-transports/reqwest", default-features = false }
reqwest = { version = "0.13.4", default-features = false, features = [
  "rustls-no-provider",
] }
rustls = { version = "0.23", default-features = false, features = [
  "fips",
  "std",
] }
tokio = { version = "1.52", features = ["macros", "rt"] }
webpki-roots = "1"
