services:
  memcached:
    image: docker.io/library/memcached@sha256:462fa779babc9b64a235a69dd843cb79fb3591f229ee1f3ff6cb2ca058d8a759
    # Allow large test objects and let the runner access the mounted socket.
    command: ["memcached", "-I", "16777216", "-s", "/tmp/memcached/memcached.sock", "-a", "0777"]
    volumes:
      - /tmp/memcached:/tmp/memcached
    healthcheck:
      test: ["CMD-SHELL", "test -S /tmp/memcached/memcached.sock"]
      interval: 5s
      timeout: 5s
      retries: 5
